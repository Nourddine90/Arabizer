<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>معرّب — ترجمة ذكية</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0a7c4a,#064e30);
       min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
  .card{background:#fff;border-radius:20px;padding:30px;max-width:820px;width:100%;
        box-shadow:0 20px 60px rgba(0,0,0,.3)}
  h1{color:#0a7c4a;text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:#666;margin-bottom:24px;font-size:14px}
  textarea{width:100%;min-height:150px;padding:14px;border:2px solid #ddd;border-radius:12px;
           font-size:16px;font-family:inherit;resize:vertical;line-height:1.6}
  textarea:focus{outline:none;border-color:#0a7c4a}
  .row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
  button{flex:1;min-width:120px;padding:13px;border:none;border-radius:12px;font-size:15px;
         font-weight:bold;cursor:pointer;transition:.2s;font-family:inherit}
  .primary{background:#0a7c4a;color:#fff}
  .primary:hover{background:#064e30}
  .primary:disabled{opacity:.6;cursor:wait}
  .secondary{background:#eee;color:#333}
  .secondary:hover{background:#ddd}
  .out{background:#f8f9fa;padding:16px;border-radius:12px;min-height:110px;
       font-size:16px;line-height:1.8;border:2px solid #eee;white-space:pre-wrap;word-break:break-word}
  .status{text-align:center;color:#0a7c4a;font-size:13px;margin:6px 0;min-height:18px}
  .foot{text-align:center;margin-top:18px;font-size:13px;color:#888}
  .foot a{color:#0a7c4a;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>🌐 معرّب</h1>
  <p class="sub">ترجمة ذكية إلى العربية — بدون إعلانات، بدون تسجيل</p>

  <textarea id="in" placeholder="الصق النص هنا أو اكتب ما تريد ترجمته..." dir="auto"></textarea>

  <div class="row">
    <button class="primary" id="go">✨ ترجم إلى العربية</button>
    <button class="secondary" id="copy">📋 نسخ</button>
    <button class="secondary" id="clr">مسح</button>
  </div>

  <div class="status" id="st"></div>
  <div class="out" id="out" dir="auto">الترجمة ستظهر هنا…</div>

  <p class="foot">
    لتعريب المواقع كاملة: استخدم <b>arabizer.user.js</b> مع Tampermonkey
  </p>
</div>

<script>
const $ = id => document.getElementById(id);

async function tr(text) {
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=' + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error('فشل الاتصال بالخادم');
  const d = await r.json();
  return d[0].map(x => x[0]).join('');
}

$('go').addEventListener('click', async () => {
  const txt = $('in').value.trim();
  if (!txt) { $('st').textContent = '⚠️ أدخل نصاً أولاً'; return; }
  $('go').disabled = true;
  $('st').textContent = '⏳ جاري الترجمة…';
  try {
    // تقسيم النصوص الطويلة (حد Google ≈ 5000 حرف)
    const parts = [];
    for (let i = 0; i < txt.length; i += 4500) parts.push(txt.slice(i, i + 4500));
    const out = (await Promise.all(parts.map(tr))).join('');
    $('out').textContent = out;
    $('st').textContent = '✅ تمت الترجمة';
  } catch (e) {
    $('st').textContent = '❌ ' + e.message;
  } finally {
    $('go').disabled = false;
  }
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('out').textContent);
        $('st').textContent = '📋 تم النسخ'; }
  catch { $('st').textContent = '⚠️ تعذّر النسخ'; }
});

$('clr').addEventListener('click', () => {
  $('in').value = ''; $('out').textContent = 'الترجمة ستظهر هنا…'; $('st').textContent = '';
});
</script>
</body>
</html>
